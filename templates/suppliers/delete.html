{% extends 'base.html' %}
{% block title %}Delete Supplier | SmartInv{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card card-glass border-danger">
      <div class="card-header bg-danger bg-opacity-10">
        <h5 class="mb-0 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete</h5>
      </div>
      <div class="card-body text-center py-5">
        <i class="bi bi-trash3 fs-1 text-danger d-block mb-3"></i>
        <h5>Delete Supplier: <strong>{{ supplier.company_name }}</strong>?</h5>
        <p class="text-muted">This action cannot be undone. All associated records will be checked.</p>
        <form method="post" class="d-flex gap-2 justify-content-center mt-4">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-2"></i>Yes, Delete</button>
          <a href="{% url 'suppliers:list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
